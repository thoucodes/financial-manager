<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Finance App</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="dashboard-container">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="brand">
                    <div class="logo"></div>
                    <h2>FinanceApp</h2>
                </div>

                <nav class="nav-menu">
                    <a href="dashboard.html" class="nav-item active">Dashboard</a>
                    <a href="transaction.html" class="nav-item">Transactions</a>
                    <a href="profile.html" class="nav-item">Profile</a>
                </nav>
            </div>

            <!-- Logout Link -->
            <div class="sidebar-bottom">
                <a href="login.html" class="nav-item logout">Logout</a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">

            <!-- Welcome Header -->
            <div class="welcome-header">
                <h1>Welcome Back, <span class="user-name">Username</span></h1>
                <p class="overview-text">Here is your financial overview</p>
            </div>

            <!-- Top Filter & Action Buttons -->
            <header class="top-bar">
                <div class="filter-group">
                    <label for="filter-type">Filter By:</label>
                    
                    <!-- Main Filter Type -->
                    <select id="filter-type" class="filter-select">
                        <option value="all">View All</option>
                        <option value="year">By Year</option>
                        <option value="month">By Month</option>
                    </select>

                    <!-- Secondary Year Selector -->
                    <select id="year-select" class="filter-select hidden">

                    </select>

                    <!-- Secondary Month Selector -->
                    <select id="month-select" class="filter-select hidden">
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>

            </header>

            <!-- Data Summary Cards -->
            <section class="cards-grid">
                <div class="card">
                    <h3>Total Balance</h3>
                    <p class="amount" id="total-balance">₹0.00</p>
                </div>

                <div class="card">
                    <h3>Total Income</h3>
                    <p class="amount income-text" id="total-income">₹0.00</p>
                </div>

                <div class="card2">
                    <h3>Total Expense</h3>
                    <p class="amount expense-text" id="total-expense">₹0.00</p>
                </div>
            </section>
                <div class="action-buttons">
                    <button class="btn btn-income" id="add-income">+ Add Income</button>

                    <button class="btn btn-expense" id="add-expense">- Add Expense</button>
                </div>

            <!-- Recent Transactions Table -->
            <section class="transactions-section">
                <div class="section-header">
                    <h3>Recent Transactions</h3>
                    <a href="transaction.html" class="view-all-link">View All Transactions →</a>
                </div>

                <div class="table-container">
                    <table class="transactions-table">
                        <thead class="table-header">
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-rows">

                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
<div id="transaction-modal" class="modal hidden">

    <div class="modal-content">

        <h2>Add Transaction</h2>

        <form id="transaction-form">

            <div class="input-group">
                <label for="category">Category</label>

                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Medical">Medical</option>
                    <option value="Education">Education</option>
                    <option value="Salary">Salary</option>
                    <option value="Scholarship">Scholarship</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="input-group">
                <label for="description">Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Enter description"
                >
            </div>

            <div class="input-group">
                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                >
            </div>

            <div class="input-group">
                <label for="date">Date</label>

                <input
                    type="date"
                    id="date"
                >
            </div>

            <button type="button" id="cancel-btn">
    Cancel
</button>

            <button type="submit" id="save-transaction">
                Save Transaction
            </button>

        </form>

    </div>

</div>
<div id="toast" class="toast hidden"></div>
<script src="js/dashboard.js"></script>
</body>
</html>
